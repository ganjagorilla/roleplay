<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050608; --glass: rgba(255, 255, 255, 0.03); --accent: #3b82f6; --border: rgba(255, 255, 255, 0.1); --text-main: #f8fafc; --text-dim: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: radial-gradient(circle at top center, #111827 0%, #050608 100%); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        #main-site { width: 100%; max-width: 680px; }
        .back-nav { width: 100%; max-width: 680px; margin-bottom: 20px; }
        .back-link { text-decoration: none; color: var(--accent); font-weight: 600; }
        h1 { font-weight: 800; font-size: 1.5rem; margin-bottom: 25px; background: linear-gradient(to right, #fff, #64748b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--text-dim); margin-bottom: 40px; font-weight: 300; }
        
        .strain-card { background: var(--glass); border: 1px solid var(--border); border-radius: 18px; margin-bottom: 12px; overflow: hidden; cursor: pointer; }
        .strain-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .prod-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; border: 1px solid var(--border); }

        .strain-content { display: grid; grid-template-rows: 0fr; transition: 0.4s ease; background: rgba(0, 0, 0, 0.2); }
        .active .strain-content { grid-template-rows: 1fr; border-top: 1px solid var(--border); }
        .inner-content { overflow: hidden; }
        .inner-padding { padding: 20px; }
        .price-tag { background: var(--accent); color: white; padding: 4px 12px; border-radius: 8px; font-weight: 800; }
    </style>
</head>
<body>
    <div class="back-nav"><a href="index.html" class="back-link">← Home</a></div>
    <div id="main-site">
        <h1>Accessories</h1>
        <p>All accesories must be ordered in!</p>
        <div id="acc-list"></div>
    </div>
    <script>
        const accs = [
            { name: "Aluminum Grinder", price: "$15", desc: "Premium 4-piece grinder with kief catcher.", img1: "images/grind-1.jpg" },
            { name: "510 Thread Battery", price: "$15", desc: "Quality 510 Threadable Cart Battery.", img1: "images/bat-1.jpg" },
            { name: "Clipper Lighter", price: "$1", desc: "Premium Refillable Clipper Lighter, Free with any purchase over $200.", img1: "images/lighter-1.jpg" },
            { name: "Rolling Machine", price: "$10", desc: "Rolls quality joints, works great with raw papers, avaliable in any size.", img1: "images/rolling-1.jpg" },
            { name: "Raw Ethereal Papers", price: "$10", desc: "RAW Ethereal are designed phenomenally thin to feel as if there was almost no paper at all! 50 papers/booklet", img1: "images/raw-1.jpg" },
            { name: "RAW Filter Tips", price: "$5", desc: "Fibre-based tips roll smooth and have enough structural rigidity to keep it's shape in your mouth and to not dissolve. 50 tips/booklet", img1: "images/filter-1.jpg" }
        ];

        function toggleCard(card) {
            const isActive = card.classList.contains('active');
            document.querySelectorAll('.strain-card').forEach(c => c.classList.remove('active'));
            if (!isActive) card.classList.add('active');
        }

        document.getElementById('acc-list').innerHTML = accs.map(a => `
            <div class="strain-card" onclick="toggleCard(this)">
                <div class="strain-header">
                    <h3>${a.name}</h3>
                    <div class="price-tag">${a.price}</div>
                </div>
                <div class="strain-content"><div class="inner-content"><div class="inner-padding">
                    <div class="img-grid">
                        <img src="${a.img1}" class="prod-img" onerror="this.src='https://via.placeholder.com/300'">
                    </div>
                    <p style="color:var(--text-dim)">${a.desc}</p>
                </div></div></div>
            </div>
        `).join('');
    </script>
</body>
</html>
