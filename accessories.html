<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050608">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Fictional accessories for a roleplay inventory showcase.">
    <title>Accessories | Roleplay Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --glass: rgba(255,255,255,0.035);
            --accent: #60a5fa;
            --border: rgba(255,255,255,0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, button, a { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        :focus-visible { outline: 3px solid rgba(96,165,250,0.75); outline-offset: 3px; }

        body {
            background:
                radial-gradient(circle at top center, rgba(59,130,246,0.15) 0%, transparent 30%),
                linear-gradient(180deg, #0a0d14, var(--bg));
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }

        .page-wrap { width: min(100%, 680px); margin: 0 auto; }
        .back-nav { margin-bottom: 14px; }
        .back-link { min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; color: var(--accent); font-weight: 700; touch-action: manipulation; }

        .hero {
            padding: 22px;
            margin-bottom: 14px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
            box-shadow: 0 16px 36px rgba(0,0,0,0.25);
        }
        h1 { font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.35rem); margin-bottom: 8px; letter-spacing: -0.04em; }
        .intro { color: var(--text-dim); line-height: 1.55; font-size: 0.9rem; }

        .accessory-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
            border: 1px solid var(--border);
            border-radius: 18px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 7px 22px rgba(0,0,0,0.2);
            transition: border-color 0.22s ease, transform 0.22s ease;
        }

        .accessory-header {
            width: 100%;
            min-height: 72px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border: 0;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
            touch-action: manipulation;
        }
        .accessory-name { min-width: 0; font-size: 1rem; font-weight: 800; }
        .header-right { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
        .price-tag { background: rgba(59,130,246,0.16); border: 1px solid rgba(96,165,250,0.28); color: #dbeafe; padding: 7px 11px; border-radius: 999px; font-size: 0.83rem; font-weight: 800; }
        .chevron { color: var(--text-dim); transition: transform 0.22s ease; }
        .accessory-card.active .chevron { transform: rotate(180deg); }

        .accessory-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease;
            background: rgba(0,0,0,0.12);
        }
        .accessory-card.active .accessory-content { grid-template-rows: 1fr; border-top: 1px solid var(--border); }
        .inner { overflow: hidden; }
        .inner-padding { padding: 14px; }

        .prod-img {
            width: 100%;
            max-height: 420px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            display: block;
            margin-bottom: 14px;
        }
        .desc { color: var(--text-dim); line-height: 1.6; font-size: 0.88rem; }
        .footer-note { color: var(--text-dim); text-align: center; font-size: 0.68rem; margin-top: 20px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; }

        @media (hover: hover) {
            .accessory-card:hover { border-color: rgba(96,165,250,0.25); transform: translateY(-1px); }
        }
        @media (max-width: 480px) {
            .hero { padding: 18px; border-radius: 20px; }
            .accessory-header { min-height: 68px; padding: 14px; }
            .prod-img { max-height: none; }
        }
        @media (hover: none) { .accessory-card:hover { transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="page-wrap">
        <div class="back-nav"><a href="index.html" class="back-link">← Home</a></div>
        <section class="hero">
            <h1>Accessories</h1>
            <p class="intro">Fictional accessory listings used as part of the roleplay interface.</p>
        </section>
        <div id="acc-list"></div>
        <div class="footer-note">Entirely fictional · Roleplay purposes only</div>
    </main>

    <script>
        const accs = [
            { name: "Aluminum Grinder", price: "$15", desc: "Premium 4-piece grinder with kief catcher.", img1: "images/grind-1_cleaned.webp" },
            { name: "510 Thread Battery", price: "$15", desc: "Quality 510-thread cart battery.", img1: "images/bat-1_cleaned.webp" },
            { name: "Clipper Lighter", price: "$1", desc: "Refillable Clipper lighter used as a fictional prop listing.", img1: "images/lighter-1_cleaned.webp" },
            { name: "Rolling Machine", price: "$10", desc: "Compact rolling machine prop listing.", img1: "images/rolling-1_cleaned.webp" },
            { name: "RAW Ethereal Papers", price: "$10", desc: "Fictional listing for a 50-paper booklet.", img1: "images/raw-1_cleaned.webp" },
            { name: "RAW Filter Tips", price: "$5", desc: "Fictional listing for a 50-tip booklet.", img1: "images/filter-1_cleaned.webp" }
        ];

        function escapeHtml(text) {
            return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
        }

        function loadCardImage(card) {
            const image = card.querySelector('img[data-src]');
            if (!image || image.dataset.loaded) return;
            image.src = image.dataset.src;
            image.dataset.loaded = 'true';
        }

        function toggleCard(button) {
            const card = button.closest('.accessory-card');
            const willOpen = !card.classList.contains('active');

            document.querySelectorAll('.accessory-card').forEach(item => {
                item.classList.remove('active');
                item.querySelector('.accessory-header').setAttribute('aria-expanded', 'false');
            });

            if (willOpen) {
                card.classList.add('active');
                button.setAttribute('aria-expanded', 'true');
                loadCardImage(card);
            }
        }

        document.getElementById('acc-list').innerHTML = accs.map((a, i) => `
            <section class="accessory-card">
                <button type="button" class="accessory-header" aria-expanded="false" aria-controls="acc-panel-${i}" onclick="toggleCard(this)">
                    <span class="accessory-name">${escapeHtml(a.name)}</span>
                    <span class="header-right"><span class="price-tag">${escapeHtml(a.price)}</span><span class="chevron" aria-hidden="true">▼</span></span>
                </button>
                <div class="accessory-content" id="acc-panel-${i}">
                    <div class="inner"><div class="inner-padding">
                        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="${escapeHtml(a.img1)}" class="prod-img" alt="${escapeHtml(a.name)}" loading="lazy" decoding="async">
                        <p class="desc">${escapeHtml(a.desc)}</p>
                    </div></div>
                </div>
            </section>
        `).join('');
    </script>
</body>
</html>
