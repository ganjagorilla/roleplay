<!DOCTYPE html>
<!-- RP build: stock-restock-v3-2026-08-08 -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Fictional roleplay inventory showcase." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Products | Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-2: #0a0d14;
            --card-top: rgba(255,255,255,0.05);
            --card-bottom: rgba(255,255,255,0.02);
            --accent: #60a5fa;
            --accent-2: #3b82f6;
            --border: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.12);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --text-soft: #cbd5e1;

            --sativa: #fbbf24;
            --hybrid: #a78bfa;
            --indica: #60a5fa;
            --medical: #34d399;
            --exotic: #f472b6;
            --mids: #94a3b8;
            --special: #fb7185;
            --mix: #fbcfe8;
            --edible: #f9a8d4;

            --stock: #4ade80;
            --oos: #f87171;
            --limited: #f97316;

            --shadow-lg: 0 18px 40px rgba(0,0,0,0.34);
            --shadow-md: 0 10px 26px rgba(0,0,0,0.24);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, button, input, select { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        button, input, select { font: inherit; }
        button, a, select { touch-action: manipulation; }
        :focus-visible { outline: 3px solid rgba(96,165,250,0.75); outline-offset: 3px; }
        html { scroll-behavior: smooth; }

        body {
            background:
                radial-gradient(circle at top center, rgba(59,130,246,0.14) 0%, transparent 28%),
                radial-gradient(circle at 18% 18%, rgba(168,85,247,0.10) 0%, transparent 24%),
                radial-gradient(circle at 84% 8%, rgba(236,72,153,0.08) 0%, transparent 20%),
                linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: max(22px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
            display: flex;
            justify-content: center;
        }

        a { color: inherit; }

        .page-wrap { width: 100%; max-width: 760px; animation: pageIn 0.7s ease; }
        .back-nav { margin-bottom: 18px; }

        .back-link {
            text-decoration: none;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.95rem;
            opacity: 0.95;
            transition: opacity 0.2s ease, transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-link:hover { opacity: 1; transform: translateX(-2px); }

        /* ── Hero ── */
        .hero {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.04);
            overflow: hidden;
            margin-bottom: 18px;
        }
        .hero::before {
            content: "";
            position: absolute;
            inset: -2px;
            background:
                radial-gradient(circle at top right, rgba(96,165,250,0.10), transparent 24%),
                radial-gradient(circle at bottom left, rgba(244,114,182,0.08), transparent 24%);
            pointer-events: none;
        }

        h1 {
            position: relative;
            z-index: 1;
            font-size: clamp(2rem, 4vw, 2.7rem);
            line-height: 1;
            letter-spacing: -0.05em;
            margin-bottom: 10px;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff 0%, #dbeafe 45%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-subtitle {
            position: relative;
            z-index: 1;
            color: var(--text-dim);
            font-size: 0.98rem;
            line-height: 1.55;
            max-width: 620px;
            margin-bottom: 18px;
        }

        .status-stack { display: flex; flex-wrap: wrap; gap: 10px; position: relative; z-index: 1; }

        .status-pill {
            border: 1px solid rgba(249,115,22,0.35);
            background: rgba(249,115,22,0.12);
            color: #fdba74;
            padding: 9px 14px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 7px;
            animation: pillPulse 2.4s ease-in-out infinite;
        }

        .status-pill-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #fb923c;
            animation: dotBlink 1.1s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pillPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(249,115,22,0.0); }
            50%       { box-shadow: 0 0 0 5px rgba(249,115,22,0.12); }
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.7); }
        }

        /* ── Stats ── */
        .stats-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0 20px; }

        .stat-card {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
            border-radius: 18px;
            padding: 14px;
            box-shadow: var(--shadow-md);
        }
        .stat-label { color: var(--text-dim); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
        .stat-value { font-size: 1.15rem; font-weight: 800; color: var(--text-main); }

        /* ── Controls ── */
        .controls-shell { position: sticky; top: max(10px, env(safe-area-inset-top)); z-index: 20; margin-bottom: 16px; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(10, 13, 20, 0.78);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(18px);
            border-radius: 18px;
            padding: 14px;
        }

        .search-wrap { flex: 1 1 260px; position: relative; }

        .search-input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 12px 14px;
            color: white;
            outline: none;
            border-radius: 12px;
            transition: 0.25s ease;
            font-size: 0.94rem;
        }
        .search-input::placeholder { color: #7c8aa0; }
        .search-input:focus {
            border-color: rgba(96,165,250,0.55);
            background: rgba(59,130,246,0.08);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.10);
        }

        .sort-select {
            background: rgba(255,255,255,0.04);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            min-width: 170px;
        }

        .chip-row { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }

        .filter-chip {
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.035);
            color: var(--text-soft);
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.22s ease;
            user-select: none;
        }
        .filter-chip:hover { border-color: rgba(96,165,250,0.22); color: white; }
        .filter-chip.active {
            color: white;
            border-color: rgba(96,165,250,0.35);
            background: linear-gradient(180deg, rgba(96,165,250,0.16), rgba(59,130,246,0.10));
            box-shadow: 0 0 0 1px rgba(96,165,250,0.06), 0 10px 20px rgba(37,99,235,0.08);
        }

        /* ── Section meta ── */
        .section-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 6px 2px 14px;
            color: var(--text-dim);
            font-size: 0.84rem;
        }
        .section-meta strong { color: white; }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.95rem;
            margin: 30px 0 14px 4px;
            color: #dbeafe;
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 800;
            opacity: 0.98;
        }

        .category-count {
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: none;
            margin-left: auto;
            padding-right: 6px;
        }

        /* ── Cards ── */
        .strain-card {
            background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
            border: 1px solid var(--border);
            border-radius: 22px;
            margin-bottom: 14px;
            overflow: hidden;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.04);
            position: relative;
        }
        .strain-card:hover {
            transform: translateY(-2px);
            border-color: rgba(96,165,250,0.22);
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.025));
            box-shadow: 0 12px 28px rgba(0,0,0,0.30), 0 0 0 1px rgba(96,165,250,0.04), 0 0 24px rgba(59,130,246,0.07);
        }

        .strain-card.limited {
            border-color: rgba(249,115,22,0.22);
            box-shadow: 0 8px 24px rgba(0,0,0,0.26), 0 0 28px rgba(249,115,22,0.08);
            animation: cardBreath 3s ease-in-out infinite;
        }
        .strain-card.limited:hover {
            border-color: rgba(249,115,22,0.40);
            box-shadow: 0 14px 32px rgba(0,0,0,0.32), 0 0 36px rgba(249,115,22,0.14);
        }

        @keyframes cardBreath {
            0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,0.26), 0 0 20px rgba(249,115,22,0.07); }
            50%       { box-shadow: 0 8px 24px rgba(0,0,0,0.26), 0 0 34px rgba(249,115,22,0.15); }
        }

        .strain-card.featured::before {
            content: "FEATURED";
            position: absolute;
            top: 12px;
            right: 14px;
            z-index: 2;
            font-size: 0.62rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            padding: 6px 8px;
            border-radius: 999px;
            color: #ffe4e6;
            background: rgba(251,113,133,0.12);
            border: 1px solid rgba(251,113,133,0.20);
        }

        /* ── Urgency bar (top of card) ── */
        .urgency-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            background: linear-gradient(90deg, rgba(249,115,22,0.13), rgba(239,68,68,0.09), rgba(249,115,22,0.07));
            border-bottom: 1px solid rgba(249,115,22,0.18);
            font-size: 0.72rem;
            font-weight: 800;
            color: #fdba74;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            overflow: hidden;
            position: relative;
        }
        .urgency-bar::after {
            content: "";
            position: absolute;
            top: 0; left: -60%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            animation: shimmer 2.6s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%   { left: -60%; }
            100% { left: 130%; }
        }

        .urgency-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #f97316;
            animation: dotBlink 1s ease-in-out infinite;
            flex-shrink: 0;
        }

        .urgency-bar-right {
            margin-left: auto;
            color: #fb923c;
            font-size: 0.68rem;
            opacity: 0.9;
            white-space: nowrap;
        }

        /* ── Card header ── */
        .strain-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
        .strain-main { min-width: 0; flex: 1; }
        .strain-name { font-size: 1.08rem; margin-bottom: 4px; font-weight: 800; letter-spacing: -0.02em; }
        .strain-sub { color: var(--text-dim); font-size: 0.82rem; line-height: 1.4; margin-bottom: 10px; text-transform: capitalize; }
        .badge-container { display: flex; gap: 7px; flex-wrap: wrap; }

        .stock-line {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 10px;
            padding: 7px 10px;
            border-radius: 11px;
            border: 1px solid currentColor;
            background: rgba(255,255,255,0.025);
            font-size: 0.72rem;
            line-height: 1.25;
            font-weight: 700;
            max-width: 100%;
        }
        .stock-line.is-in { color: #86efac; background: rgba(34,197,94,0.07); border-color: rgba(74,222,128,0.24); }
        .stock-line.is-limited { color: #fdba74; background: rgba(249,115,22,0.08); border-color: rgba(251,146,60,0.28); }
        .stock-line.is-out { color: #fca5a5; background: rgba(239,68,68,0.07); border-color: rgba(248,113,113,0.24); }
        .stock-line-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 13%, transparent); }
        .stock-line-label { font-weight: 850; white-space: nowrap; }
        .stock-line-date { color: currentColor; opacity: 0.78; min-width: 0; }
        .stock-badge { text-transform: uppercase; letter-spacing: 0.035em; }

        .badge {
            font-size: 0.62rem;
            font-weight: 800;
            padding: 5px 9px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: 1px solid currentColor;
            background: rgba(255,255,255,0.035);
            backdrop-filter: blur(8px);
        }

        .sativa  { color: var(--sativa); }
        .indica  { color: var(--indica); }
        .hybrid  { color: var(--hybrid); }
        .medical { color: var(--medical); }
        .exotic  { color: var(--exotic); }
        .mids    { color: var(--mids); }
        .edible  { color: var(--edible); }
        .mix     { color: var(--mix); }
        .special { color: var(--special); }
        .st-in   { color: var(--stock); }
        .st-out  { color: var(--oos); }
        .potency { color: var(--text-dim); border-color: var(--border-strong); }
        .mg      { color: var(--text-dim); border-color: var(--border-strong); }

        .st-lim {
            color: #fb923c;
            border-color: #f97316;
            background: rgba(249,115,22,0.10);
            animation: badgePop 2s ease-in-out infinite;
        }

        @keyframes badgePop {
            0%, 100% { box-shadow: 0 0 0 0 rgba(249,115,22,0); }
            50%       { box-shadow: 0 0 0 3px rgba(249,115,22,0.18); }
        }

        .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .from-pill {
            font-size: 0.79rem;
            font-weight: 800;
            color: #fff;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 8px 11px;
            border-radius: 999px;
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .strain-card.limited .from-pill {
            border-color: rgba(249,115,22,0.30);
            background: rgba(249,115,22,0.08);
            color: #fed7aa;
        }

        .chevron { color: var(--text-dim); font-size: 0.95rem; transition: transform 0.25s ease; flex-shrink: 0; }
        .strain-card.active .chevron { transform: rotate(180deg); }

        /* ── Expandable content ── */
        .strain-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.38s ease, border-top 0.2s ease;
            background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(0,0,0,0.12));
        }
        .strain-card.active .strain-content {
            grid-template-rows: 1fr;
            border-top: 1px solid var(--border);
        }

        .inner-content { overflow: hidden; }
        .inner-padding { padding: 20px; }

        /* ── Image grids ── */
        .img-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
        .img-grid.single { grid-template-columns: 1fr; }
        .img-grid.three  { grid-template-columns: repeat(3, minmax(0, 1fr)); }

        .prod-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            background: rgba(255,255,255,0.02);
            cursor: zoom-in;
        }
        .prod-img:hover {
            transform: scale(1.03);
            border-color: rgba(96,165,250,0.30);
            box-shadow: 0 8px 24px rgba(0,0,0,0.30), 0 0 0 2px rgba(96,165,250,0.12);
        }

        /* ── Lightbox ── */
        .lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.92); backdrop-filter: blur(16px); align-items: center; justify-content: center; }
        .lightbox.open { display: flex; animation: lbFadeIn 0.22s ease; }
        @keyframes lbFadeIn { from { opacity: 0; } to { opacity: 1; } }

        .lb-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px; max-width: min(90vw, 720px); width: 100%; }
        .lb-img-wrap { position: relative; width: 100%; display: flex; align-items: center; justify-content: center; }

        .lb-img { width: 100%; max-height: 72vh; object-fit: contain; border-radius: 18px; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 24px 60px rgba(0,0,0,0.60); }

        .lb-close {
            position: fixed; top: 18px; right: 18px; width: 42px; height: 42px; border-radius: 999px;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: white;
            font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s ease, transform 0.2s ease; z-index: 1001;
        }
        .lb-close:hover { background: rgba(255,255,255,0.18); transform: scale(1.08); }

        .lb-nav {
            position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px;
            border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
            color: white; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: background 0.2s ease, opacity 0.2s ease; z-index: 2; user-select: none;
        }
        .lb-nav:hover { background: rgba(255,255,255,0.18); }
        .lb-nav.hidden { opacity: 0; pointer-events: none; }
        .lb-prev { left: -58px; }
        .lb-next { right: -58px; }

        .lb-footer { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .lb-dots { display: flex; gap: 8px; align-items: center; }
        .lb-dot { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 999px; background: rgba(255,255,255,0.25); transition: background 0.2s ease, transform 0.2s ease; cursor: pointer; }
        .lb-dot.active { background: white; transform: scale(1.35); }
        .lb-counter { color: var(--text-dim); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; }

        /* ── Content ── */
        .desc { color: var(--text-dim); margin-bottom: 16px; font-size: 0.9rem; line-height: 1.55; }
        .meta-line { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

        .meta-pill {
            font-size: 0.72rem; font-weight: 700; color: var(--text-soft); padding: 7px 10px;
            border-radius: 999px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08);
        }

        /* ── Urgency note (inside expanded card) ── */
        .urgency-note {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 11px 14px;
            border-radius: 12px;
            background: linear-gradient(90deg, rgba(249,115,22,0.10), rgba(239,68,68,0.07));
            border: 1px solid rgba(249,115,22,0.20);
            margin-bottom: 14px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fdba74;
        }
        .urgency-note-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
        .urgency-note-text { line-height: 1.45; }
        .urgency-note-text strong { color: #fb923c; font-weight: 800; }

        /* ── Pricing ── */
        .price-list { display: grid; gap: 8px; }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            background: rgba(255,255,255,0.025);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.07);
            transition: border-color 0.22s ease, transform 0.22s ease, background 0.22s ease;
        }
        .price-row:hover { border-color: rgba(96,165,250,0.18); background: rgba(255,255,255,0.04); transform: translateY(-1px); }

        /* ── Lightbox ── */

            lbImages = images; lbIndex = startIndex;

            const lightbox = document.getElementById("lightbox");
            lightbox.classList.add("open");
            lightbox.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            const lightbox = document.getElementById("lightbox");
            lightbox.classList.remove("open");
            lightbox.setAttribute("aria-hidden", "true");
            document.body.style.overflow = "";
        }

        function lbNav(dir) {
            lbIndex = Math.max(0, Math.min(lbImages.length - 1, lbIndex + dir));
            updateLightbox();
        }

            const img = document.getElementById("lbImg");
            img.style.opacity = "0";
            img.style.transform = "scale(0.97)";
            img.style.transition = "opacity 0.18s ease, transform 0.18s ease";
            setTimeout(() => {
                img.src = lbImages[lbIndex];
                img.style.opacity = "1";
                img.style.transform = "scale(1)";
            }, 80);

            document.getElementById("lbPrev").classList.toggle("hidden", lbIndex === 0);
            document.getElementById("lbNext").classList.toggle("hidden", lbIndex === lbImages.length - 1);

            document.getElementById("lbDots").innerHTML = lbImages.map((_, i) =>
                `<button type="button" class="lb-dot${i === lbIndex ? " active" : ""}" aria-label="View image ${i + 1}" onclick="lbIndex=${i};updateLightbox()"></button>`
            ).join("");

            document.getElementById("lbCounter").textContent = lbImages.length > 1 ? `${lbIndex + 1} / ${lbImages.length}` : "";
        }

            const l = label.toLowerCase();
            if (l.includes("piece")||l.includes("bar")||l.includes("unit")||l.includes("cart")) return "";
            const m = label.match(/[\d.]+/);
            if (!m) return "";
            const w = parseFloat(m[0]);
            if (!w || w <= 0) return "";
            return `$${(price/w).toFixed(2)}/g`;

                return b.join("");

            if (typeof p.potency === "number") {
                let badge = `<span class="badge potency">${p.potency}% THC</span>`;
                if (typeof p.potency2 === "number") badge += `<span class="badge potency">${p.potency2}% THC</span>`;

            return "";

            if (!p.inStock) {

            if (!value) return "";
            const [year, month, day] = value.split("-").map(Number);

        }

        }

        function getFilterLabel(f) {
            return { all:"Viewing all products", flower:"Viewing flower products", medical:"Viewing medical products",
                     edible:"Viewing edible products", special:"Viewing special deals", instock:"Viewing in-stock products",
                     restocking:"Viewing scheduled restocks" }[f] || "Viewing products";
        }

        /* ── Stats ── */
        function buildStats() {
            const total    = products.length;
            const inStock  = products.filter(p => p.inStock).length;
            const cats     = new Set(products.map(p => p.category)).size;
            const restocks = products.filter(p => !p.inStock && (p.restockDate || p.restockWindow)).length;
            statsRow.innerHTML = `
                <div class="stat-card"><div class="stat-label">Products</div><div class="stat-value">${total}</div></div>
                <div class="stat-card"><div class="stat-label">Categories</div><div class="stat-value">${cats}</div></div>
                <div class="stat-card"><div class="stat-label">Restocks</div><div class="stat-value">${restocks}</div></div>
                <div class="stat-card"><div class="stat-label">In Stock</div><div class="stat-value">${inStock}</div></div>`;
        }

        /* ── Images ── */
        function getProductImages(p) {
            const imgs = [p.imgBulk, p.imgClose, p.imgClose1].filter(Boolean);
            return imgs.length ? imgs : ["https://via.placeholder.com/700x700?text=Image+Coming+Soon"];
        }

        function renderProductImages(p) {
            const images  = getProductImages(p);
            const cls     = images.length === 1 ? "img-grid single" : images.length === 3 ? "img-grid three" : "img-grid";
            const encoded = encodeURIComponent(JSON.stringify(images));
            return `
                <div class="${cls}">
                    ${images.map((src, i) => `
                        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="${escapeHtml(src)}" class="prod-img"
                            alt="${escapeHtml(p.name)} image ${i + 1}" loading="lazy" decoding="async"
                            data-images="${encoded}" data-index="${i}"
                            onclick="event.stopPropagation();openLightbox(JSON.parse(decodeURIComponent(this.dataset.images)),parseInt(this.dataset.index))"
                            onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 700 700%22%3E%3Crect width=%22700%22 height=%22700%22 fill=%22%2312141c%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%2394a3b8%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-family=%22Arial%22 font-size=%2232%22%3EImage unavailable%3C/text%3E%3C/svg%3E'">
                    `).join("")}
                </div>`;
        }

        /* ── Card toggle ── */
        function loadCardImages(card) {
            card.querySelectorAll("img[data-src]").forEach(img => {
                if (img.dataset.loaded) return;
                img.src = img.dataset.src;
                img.dataset.loaded = "true";
            });
        }

        function toggleCard(card) {
            const isActive = card.classList.contains("active");
            document.querySelectorAll(".strain-card").forEach(c => {
                c.classList.remove("active");
                c.setAttribute("aria-expanded", "false");
            });
            if (!isActive) {
                card.classList.add("active");
                card.setAttribute("aria-expanded", "true");
                loadCardImages(card);
            }
        }

        function handleCardKey(event, card) {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            toggleCard(card);
        }

        /* ── Render ── */
        function getFilteredProducts() {
            const term   = searchInput.value.toLowerCase().trim();
            const sortBy = sortSelect.value;

            let filtered = products.filter(p => {
                const hay = [p.name, p.category, p.type, p.flare, p.desc].filter(Boolean).join(" ").toLowerCase();
                return hay.includes(term) && matchesFilter(p, currentFilter);
            });

            if (sortBy === "p-low")              filtered.sort((a, b) => a.price - b.price);
            else if (sortBy === "p-high")        filtered.sort((a, b) => b.price - a.price);
            else if (sortBy === "strength-high") filtered.sort((a, b) => getStrengthValue(b) - getStrengthValue(a));
            else if (sortBy === "name-az")       filtered.sort((a, b) => a.name.localeCompare(b.name));

            return filtered;
        }

        function renderList() {
            const filtered  = getFilteredProducts();
            const sortBy    = sortSelect.value;
            const catCounts = filtered.reduce((acc, p) => { acc[p.category] = (acc[p.category] || 0) + 1; return acc; }, {});

            resultCount.textContent       = filtered.length;
            activeFilterLabel.textContent = getFilterLabel(currentFilter);

            if (!filtered.length) {
                inventory.innerHTML = `<div class="empty-state"><h3>No matches found</h3><p>Try adjusting your search, sort or active filter.</p></div>`;
                return;
            }

            let html = "", lastCat = "";

            filtered.forEach((p, idx) => {
                if (sortBy === "default" && p.category !== lastCat) {
                    html += `<div class="category-header"><span>${escapeHtml(p.category)}</span><span class="category-count">${catCounts[p.category]} item${catCounts[p.category] !== 1 ? "s" : ""}</span></div>`;
                    lastCat = p.category;
                }

                const classes  = ["strain-card"];
                if (p.featured)     classes.push("featured");
                if (p.limitedStock) classes.push("limited");

                const subParts = [];
                if (p.flare) subParts.push(p.flare);
                if (p.type)  subParts.push(p.type);

                html += `
                    <div class="${classes.join(" ")}" role="button" tabindex="0" aria-expanded="false" onclick="toggleCard(this)" onkeydown="handleCardKey(event,this)" style="animation:pageIn 0.35s ease;animation-delay:${idx * 0.03}s;">
                        ${getUrgencyBar(p)}
                        <div class="strain-header">
                            <div class="strain-main">
                                <div class="strain-name" style="color:${p.nameColor || "var(--text-main)"};">${escapeHtml(p.name)}</div>
                                <div class="strain-sub">${escapeHtml(subParts.join(" • "))}</div>
                                <div class="badge-container">
                                    <span class="badge ${escapeHtml(p.flare)}">${escapeHtml(p.flare)}</span>
                                    <span class="badge ${escapeHtml(p.type)}">${escapeHtml(p.type)}</span>
                                    ${getStrengthBadge(p)}
                                    ${getStockBadge(p)}
                                </div>
                                ${getStockLine(p)}
                            </div>
                            <div class="header-right">
                                <span class="from-pill">From ${formatPrice(p.price)}</span>
                                <span class="chevron">▼</span>
                            </div>
                        </div>

                        <div class="strain-content">
                            <div class="inner-content">
                                <div class="inner-padding">
                                    ${renderProductImages(p)}
                                    <div class="meta-line">${getMetaPills(p)}</div>
                                    ${getUrgencyNote(p)}
                                    <p class="desc">${escapeHtml(p.desc)}</p>
                                    <div class="price-list">
                                        ${Object.entries(p.tiers).map(([qty, val]) => `
                                            <div class="price-row">
                                                <div class="price-left">${escapeHtml(qty)}</div>
                                                <div class="price-right">
                                                    <div class="price-main">${formatPrice(val)}</div>
                                                    ${calcPerGram(qty, val) ? `<div class="price-per-g">${calcPerGram(qty, val)}</div>` : ""}
                                                </div>
                                            </div>`).join("")}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });

            inventory.innerHTML = html;
        }

        chipRow.addEventListener("click", (e) => {
            const chip = e.target.closest(".filter-chip");
            if (!chip) return;
            document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
            chip.classList.add("active");
            currentFilter = chip.dataset.filter;
            renderList();
        });

        searchInput.addEventListener("input", renderList);
        sortSelect.addEventListener("change", renderList);

        buildStats();
        renderList();
    </script>
</body>
</html>
