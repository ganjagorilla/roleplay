<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Shared CSS variables and styles from existing theme */
        :root {
            --bg: #050608; --surface: #12141c; --glass: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.07); --accent: #3b82f6; --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc; --text-dim: #94a3b8;
            --sativa: #fbbf24; --hybrid: #a78bfa; --indica: #60a5fa; --oos: #f87171; --stock: #4ade80;
            --medical: #10b981; --exotic: #ec4899; --mids: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: radial-gradient(circle at top center, #111827 0%, #050608 100%); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        #main-site { width: 100%; max-width: 680px; }
        .back-nav { width: 100%; max-width: 680px; margin-bottom: 20px; }
        .back-link { text-decoration: none; color: var(--accent); font-size: 0.9rem; font-weight: 600; }
        h1 { font-weight: 800; font-size: 1.8rem; margin-bottom: 25px; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; background: rgba(18, 20, 28, 0.95); padding: 10px; border-radius: 14px; border: 1px solid var(--border); position: sticky; top: 10px; z-index: 100; }
        .search-input { flex: 1 1 200px; background: transparent; border: none; padding: 8px 12px; color: white; outline: none; }
        .sort-select { flex: 1 0 auto; background: var(--bg); color: var(--text-main); border: 1px solid var(--border); border-radius: 10px; padding: 8px; font-size: 0.8rem; }
        .strain-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 18px; margin-bottom: 12px; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .strain-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .badge-container { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .badge { font-size: 0.6rem; font-weight: 800; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; }
        .sativa { color: var(--sativa); border: 1px solid var(--sativa); }
        .indica { color: var(--indica); border: 1px solid var(--indica); }
        .hybrid { color: var(--hybrid); border: 1px solid var(--hybrid); }
        .st-in { color: var(--stock); border: 1px solid var(--stock); }
        .st-out { color: var(--oos); border: 1px solid var(--oos); }
        .strain-content { display: grid; grid-template-rows: 0fr; transition: 0.4s ease; background: rgba(0,0,0,0.2); }
        .active .strain-content { grid-template-rows: 1fr; border-top: 1px solid var(--border); }
        .inner-content { overflow: hidden; padding: 0 20px; }
        .active .inner-content { padding: 20px 20px; }
        .prod-img { width: 100%; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border); }
        .price-row { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 8px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="back-nav"><a href="index.html" class="back-link">← Home</a></div>
    <div id="main-site">
        <h1>Available Products</h1>
        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Search..." oninput="renderList()">
            <select id="sortSelect" class="sort-select" onchange="renderList()">
                <option value="default">In Stock First</option>
                <option value="thc-high">THC: High</option>
            </select>
        </div>
        <div id="inventory"></div>
    </div>

    <script>
        const products = [
            { name: "Northern Lights", type: "indica", flare: "medical", potency: 22, inStock: true, price: 20, img: "https://via.placeholder.com/600x300", desc: "Gold standard for relaxation.", tiers: { "1g Flat Rate": 20 } },
            { name: "Durban Poison", type: "sativa", flare: "medical", potency: 22, inStock: true, price: 20, img: "https://via.placeholder.com/600x300", desc: "Uplifting organic sativa.", tiers: { "1g Flat Rate": 20 } },
            { name: "Tangelo", type: "sativa", flare: "mids", potency: 16, inStock: true, price: 250, img: "https://via.placeholder.com/600x300", desc: "Mango/citrus aroma.", tiers: { "28g": 250, "14g": 130 } }
        ];

        function toggleCard(card) {
            const isActive = card.classList.contains('active');
            document.querySelectorAll('.strain-card').forEach(c => c.classList.remove('active'));
            if (!isActive) card.classList.add('active');
        }

        function renderList() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;
            const container = document.getElementById('inventory');
            let filtered = products.filter(p => p.name.toLowerCase().includes(searchTerm));
            if (sortBy === 'default') filtered.sort((a,b) => b.inStock - a.inStock);
            
            container.innerHTML = filtered.map(p => `
                <div class="strain-card" onclick="toggleCard(this)">
                    <div class="strain-header">
                        <div>
                            <h3>${p.name}</h3>
                            <div class="badge-container">
                                <span class="badge ${p.type}">${p.type}</span>
                                <span class="badge ${p.inStock ? 'st-in' : 'st-out'}">${p.inStock ? 'In Stock' : 'OOS'}</span>
                            </div>
                        </div>
                        <span>▼</span>
                    </div>
                    <div class="strain-content">
                        <div class="inner-content">
                            <img src="${p.img}" class="prod-img" alt="${p.name}">
                            <p style="color: var(--text-dim); margin-bottom: 15px;">${p.desc}</p>
                            ${Object.entries(p.tiers).map(([qty, val]) => `
                                <div class="price-row"><span>${qty}</span><strong>$${val}</strong></div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }
        renderList();
    </script>
</body>
</html>
